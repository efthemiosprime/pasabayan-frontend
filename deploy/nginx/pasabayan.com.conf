server {
    server_name pasabayan.com www.pasabayan.com;

    root /var/www/pasabayan-frontend/build;
    index index.html;

    # Apple App Site Association — iOS Universal Links.
    # Exact-match location beats the SPA "location /" fallback; force JSON type.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Content-Type application/json;
        return 200 '{"applinks":{"details":[{"appID":"2F2MGP4R3K.com.efthemiosprime.Pasabayan","paths":["/app/*"]}]}}';
    }

    location /snapflow {
        try_files $uri $uri/ /snapflow/index.html;
    }

    # IMPORTANT: $uri/ is required so directory index.html files resolve.
    # Each static page (privacy-policy/, terms-of-service/, support/, etc.)
    # is built as <dir>/index.html. Without $uri/, nginx skips the directory
    # index and every subpage falls through to /index.html (the home page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    # Hero search relay (pasabayan-api B39, pasabayan-specs ADR-20).
    # The API answers /api/public/website-search only when the relay key is
    # present; this server adds it, so the browser never sees it. Exact match
    # only — never widen this to a prefix `location /api`.
    # Needs two server-only files (not in git) — see deploy/nginx/README.md:
    #   /etc/nginx/snippets/cloudflare-realip.conf   (set_real_ip_from lines)
    #   /etc/nginx/snippets/pasabayan-relay-key.conf (proxy_set_header ... key)
    location = /api/public/website-search {
        # pasabayan.com is behind Cloudflare: recover the visitor's address,
        # trusting CF-Connecting-IP only from Cloudflare's own ranges.
        include /etc/nginx/snippets/cloudflare-realip.conf;
        real_ip_header CF-Connecting-IP;

        limit_except GET { deny all; }

        proxy_pass https://api.pasabayan.com;
        proxy_ssl_server_name on;
        proxy_set_header Host api.pasabayan.com;

        # The API rate-limits per visitor on this header.
        proxy_set_header X-Pasabayan-Visitor-IP $remote_addr;
        include /etc/nginx/snippets/pasabayan-relay-key.conf;

        # Pass nothing else of the visitor's request to the API zone.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-Ray "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }

    # No generic `location /api`: the old one proxied to 127.0.0.1:8000, where
    # nothing listens on this server (502), and the site calls api.pasabayan.com
    # directly. Only the exact-match relay above reaches the API through here —
    # a prefix /api relay would expose every public API GET via this server's IP.

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pasabayan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pasabayan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.pasabayan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = pasabayan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pasabayan.com www.pasabayan.com;
    return 404; # managed by Certbot
}
